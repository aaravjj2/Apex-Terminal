# Active backend CI workflow (replaces disabled "Backend Tests" workflow on GitHub).
# Same checks: unit tests, integration tests, secrets scan, lint.

name: Backend CI

on:
  push:
    branches: [main, develop, master]
    paths:
      - 'phase1/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop, master]
    paths:
      - 'phase1/**'
  workflow_dispatch:

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: phase1/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run CI guard test (no secrets in code)
        env:
          PROFILE: prod
        run: pytest tests/unit/test_config.py::TestConfigSecrets::test_ci_guard_no_hardcoded_secrets -v
      - name: Run unit tests
        env:
          PROFILE: dev
          ALPACA3_KEY: test_key_for_ci
          ALPACA3_SECRET: test_secret_for_ci
          APCA_API_KEY_ID: test_key_for_ci
          APCA_API_SECRET_KEY: test_secret_for_ci
        run: pytest tests/unit/ -v --tb=short
      - name: Run trading window tests
        env:
          PROFILE: dev
          ALPACA3_KEY: test_key_for_ci
          ALPACA3_SECRET: test_secret_for_ci
          APCA_API_KEY_ID: test_key_for_ci
          APCA_API_SECRET_KEY: test_secret_for_ci
        run: pytest tests/unit/test_trading_window.py -v --tb=short
      - name: Run integration tests
        env:
          PROFILE: dev
          ALPACA3_KEY: test_key_for_ci
          ALPACA3_SECRET: test_secret_for_ci
          APCA_API_KEY_ID: test_key_for_ci
          APCA_API_SECRET_KEY: test_secret_for_ci
        run: pytest tests/integration/ -v --tb=short

  secrets-check:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets in source trees
        run: |
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16})" \
            --include="*.py" --include="*.ts" --include="*.tsx" \
            phase1 frontend scripts; then
            echo "Potential secrets found in source!"
            exit 1
          fi
          echo "No secrets detected"
      - name: Verify keys.env is not committed
        run: |
          test ! -f keys.env && test ! -f phase1/keys.env
          echo "keys.env not in repo"
