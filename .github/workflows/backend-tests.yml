# GitHub Actions workflow for Python backend tests
# Runs on all pushes and pull requests to main/develop branches
#
# Tests include:
# - Unit tests (pytest)
# - Integration tests
# - Config/secrets CI guard

name: Backend Tests

on:
  push:
    branches: [main, develop, master]
    paths:
      - 'phase1/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main, develop, master]
    paths:
      - 'phase1/**'
  schedule:
    # Run at 9:00 AM ET (14:00 UTC) on weekdays to verify before market open
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: phase1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: phase1/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run CI guard test (no secrets in code)
        env:
          PROFILE: prod
        run: |
          pytest tests/unit/test_config.py::TestConfigSecrets::test_ci_guard_no_hardcoded_secrets -v
      
      - name: Run unit tests
        env:
          PROFILE: dev
          # Mock Alpaca credentials for tests
          ALPACA3_KEY: test_key_for_ci
          ALPACA3_SECRET: test_secret_for_ci
        run: |
          pytest tests/unit/ -v --tb=short -x
      
      - name: Run trading window tests
        env:
          PROFILE: dev
          ALPACA3_KEY: test_key_for_ci
          ALPACA3_SECRET: test_secret_for_ci
        run: |
          pytest tests/unit/test_trading_window.py -v --tb=short
      
      - name: Run integration tests
        env:
          PROFILE: dev
          ALPACA3_KEY: test_key_for_ci
          ALPACA3_SECRET: test_secret_for_ci
        run: |
          pytest tests/integration/ -v --tb=short || echo "Integration tests may require live API"

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: phase1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install linting tools
        run: |
          pip install ruff black mypy
      
      - name: Check formatting with Black
        run: |
          black --check services/ tests/ || echo "Formatting issues found"
      
      - name: Lint with Ruff
        run: |
          ruff check services/ tests/ || echo "Linting issues found"

  secrets-check:
    name: Secrets Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Scan for secrets
        run: |
          # Check for common secret patterns
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16})" --include="*.py" --include="*.env*" .; then
            echo "❌ Potential secrets found in code!"
            exit 1
          fi
          echo "✅ No secrets detected"
      
      - name: Verify keys.env is gitignored
        run: |
          if [ -f "phase1/keys.env" ]; then
            echo "❌ keys.env should not be committed!"
            exit 1
          fi
          if [ -f "keys.env" ]; then
            echo "❌ keys.env should not be committed!"
            exit 1
          fi
          echo "✅ No keys.env files committed"
