name: E2E Tests

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'frontend/**'
      - 'phase1/**'
      - '.github/**'
      - 'scripts/**'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'frontend/**'
      - 'phase1/**'
      - '.github/**'
      - 'scripts/**'
  schedule:
    # Weekdays 15:00 UTC — after backend scheduled runs
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    env:
      CI: true
      PROFILE: dev
      ALPACA3_KEY: test_key_for_ci
      ALPACA3_SECRET: test_secret_for_ci
      APCA_API_KEY_ID: test_key_for_ci
      APCA_API_SECRET_KEY: test_secret_for_ci
      APEX_BACKEND_PORT: '8000'
      APEX_FRONTEND_PORT: '5100'
      PLAYWRIGHT_BASE_URL: http://localhost:5100

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: phase1/requirements.txt

      - name: Install backend dependencies
        working-directory: phase1
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: |
          npx playwright test \
            tests/e2e/dashboard.spec.ts \
            tests/e2e/ui-smoke.spec.ts \
            --config=playwright.config.ts

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 7
