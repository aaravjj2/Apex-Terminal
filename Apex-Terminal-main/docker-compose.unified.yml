version: "3.8"

# Unified Docker Compose for TradingView Recreation
# Runs all services: PostgreSQL, API, Ingestion, n8n, Frontend

services:
  # === DATABASE ===
  db:
    image: postgres:15-alpine
    container_name: autopilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashboard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newpassword}
      POSTGRES_DB: ${POSTGRES_DB:-financial_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - autopilot-network

  # === BACKEND API ===
  api:
    build:
      context: ./phase1
      dockerfile: Dockerfile
    container_name: autopilot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dashboard_user}:${POSTGRES_PASSWORD:-newpassword}@db:5432/${POSTGRES_DB:-financial_dashboard}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - APCA_API_KEY_ID=${APCA_API_KEY_ID}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY}
      - APCA_ENDPOINT=${APCA_ENDPOINT:-https://paper-api.alpaca.markets}
      - TRADIER_API_KEY=${TRADIER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./phase1/fixtures:/app/fixtures:ro
      - ./phase1/data:/app/data
    command: ["python", "-m", "uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - autopilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # === N8N WORKFLOW AUTOMATION ===
  n8n:
    image: n8nio/n8n:latest
    container_name: autopilot-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=America/New_York
      - GENERIC_TIMEZONE=America/New_York
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_BASIC_AUTH_ACTIVE=false
      # Backend connection
      - BACKEND_URL=http://api:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - autopilot-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # === FRONTEND (Development) ===
  frontend:
    image: node:20-alpine
    container_name: autopilot-frontend
    working_dir: /app
    ports:
      - "5100:5100"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5100"
    depends_on:
      - api
    networks:
      - autopilot-network

networks:
  autopilot-network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  frontend_node_modules:

# Usage:
# 1. Copy .env.example to .env and fill in API keys
# 2. Start all services: docker compose -f docker-compose.unified.yml up -d
# 3. Access:
#    - API: http://localhost:8000
#    - n8n: http://localhost:5678
#    - Frontend: http://localhost:5100
# 4. Import n8n workflows from /home/node/workflows
