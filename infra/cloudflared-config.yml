# Cloudflare Tunnel config for Apex Terminal
# ─────────────────────────────────────────────────────────────────────────────
# This file lives at ~/.cloudflared/config.yml.
# Copy it there after running `cloudflared tunnel create apex-terminal`
# and filling in the UUID + domain.
#
# Quick ephemeral (no account needed, URL changes on restart):
#   cloudflared tunnel --url http://localhost:8000
#
# Persistent named tunnel (requires free Cloudflare account + domain):
#   1.  cloudflared tunnel login
#   2.  cloudflared tunnel create apex-terminal
#   3.  Copy config below, fill in TUNNEL_UUID and DOMAIN
#   4.  cloudflared tunnel route dns apex-terminal api.yourdomain.com
#   5.  cloudflared tunnel run apex-terminal
# ─────────────────────────────────────────────────────────────────────────────

# Replace with UUID printed by `cloudflared tunnel create apex-terminal`
tunnel: TUNNEL_UUID_HERE

# Replace YOUR_USERNAME with your Linux username (aarav)
credentials-file: /home/aarav/.cloudflared/TUNNEL_UUID_HERE.json

ingress:
  # FastAPI backend (public endpoint)
  - hostname: api.yourdomain.com      # ← replace with your domain
    service: http://localhost:8000

  # Catch-all (required by cloudflared)
  - service: http_status:404
